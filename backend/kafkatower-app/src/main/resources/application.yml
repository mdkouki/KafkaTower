server:
  port: 8089
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html
    min-response-size: 2048

embabel:
  # The LLM (API key, base URL, model) is not configured here: an admin sets it in the UI, it is
  # stored in the database and applied by LlmSettingsEnvironmentPostProcessor, which also decides
  # whether Embabel and the assistant run at all. To configure it as code instead, set
  # kafkatower.assistant.enabled=true plus embabel.agent.platform.models.openai.{api-key,base-url},
  # embabel.models.default-llm and the matching spring.ai.openai.* properties.
  agent:
    platform:
      # Run the tool calls an LLM emits in the same turn concurrently (e.g. askMetrics + askLogs, or
      # several PromQL queries) instead of one after another. Applies to the orchestrator and every
      # specialist. The timeouts MUST exceed a specialist's own multi-turn run — the defaults (30s per
      # tool, 60s per batch) would cut one off. Roll back by setting type: DEFAULT.
      toolloop:
        type: PARALLEL
        parallel:
          per-tool-timeout: 300s
          batch-timeout: 330s
          executor-type: VIRTUAL
      observability:
        enabled: true
        service-name: kafkatower
        max-attribute-length: 2000

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  threads:
    # Every chat request blocks for seconds-to-minutes on LLM/tool calls; virtual threads lift the
    # platform-thread ceiling on concurrent chats. See also KafkaTowerApplication (Reactor side).
    virtual:
      enabled: true
  web:
    error:
      # The settings panel shows the reason a save was rejected (e.g. a failed connection check).
      include-message: always
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  # PostgreSQL by default; activate the "h2" profile for a single-node setup without a database server.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kafkatower}
    username: ${DB_USER:kafkatower}
    password: ${DB_PASSWORD:kafkatower}
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    # baseline-on-migrate: true when upgrading an existing instance that was managed by ddl-auto.
    # Flyway will mark it as at V1 baseline and only apply new migrations (V2+).
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB

agent:
  orchestration:
    # KafkaInspector's draft -> reviewer -> refine loop: max rounds before returning the last
    # draft regardless of the reviewer's verdict (every draft is still reviewed, including the last).
    max-rounds: 2
  llm:
    # Any LLM call (classification, draft, completeness-check, or a specialist's own call)
    # slower than this logs a warning — see SlowLlmCallLogger.
    slow-call-warning-ms: 15000
  # The metrics backend (agent.metrics.*) and the OpenSearch log connections (agent.mcp.os.*) are
  # configured by an admin under Settings in the console, not here.


management:
  tracing:
    export:
      # Standard Spring/Micrometer OTLP tracing pipeline — no Langfuse-specific client in the
      # app. Auto-enabled only once an endpoint is actually configured (see below); harmless
      # to leave `true` otherwise since OtlpTracingAutoConfiguration itself no-ops without one.
      enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Plain OTLP, no vendor client or credentials in the app — this points at the local
          # OTel Collector (compose.yml's otel-collector service, OTLP HTTP on 4318), which
          # forwards to whichever trace sink it's configured for (see
          # config/otel-collector/otel-collector-config.yaml). Override for a different
          # collector/OTLP receiver, or point straight at a backend that needs no auth.
          endpoint: ${OTEL_COLLECTOR_ENDPOINT:http://localhost:6006/v1/traces}
          # Auth header for the collector/backend at the endpoint above, if it requires one
          # (e.g. Phoenix with PHOENIX_ENABLE_AUTH=True — see
          # config/otel-collector/otel-collector-config.yaml). Set OTEL_COLLECTOR_AUTH_HEADER
          # (e.g. "Bearer <token>") in the environment; never hardcode a token here.
          headers:
            authorization: "Bearer ${OTEL_COLLECTOR_AUTH_API_KEY}"

# The Kafka clusters (kafka.clusters.*) are configured by an admin under Settings > Kafka in the
# console: none, mTLS or SASL, with certificates referenced by file path on the server.


app:
  security:
    mode: jaas   # jaas | ldap | oidc

    # Roles allowed to read Kafka message payloads (Topics > Content tab). ADMIN only by default;
    # add USER to open it to everyone signed in.
    topic-content-roles: [ADMIN]

    api-clients:
      - name: kafka-ui
        token: ${API_TOKEN_KAFKA_UI:changeme-kafka-ui}
      - name: conduktor
        token: ${API_TOKEN_CONDUKTOR:changeme-conduktor}

    jaas:
      users:
        - username: admin
          password: "admin123"
          role: ADMIN
        - username: user
          password: "user123"
          role: USER

    ldap:
      url: ldap://localhost:389
      userDn: 'cn=admin,dc=example,dc=com'
      password: 'adminpassword'
      base: dc=example,dc=com
      user-search-base: ou=people
      user-search-filter: "(uid={0})"
      default-role: USER
      # Group-search mode (local OpenLDAP): populate roles from group membership
      #group-search-base: ou=groups
      #group-search-filter: "(member={0})"
      #role-mappings:
      #  ADMIN: "cn=kafka-admins,ou=groups,dc=example,dc=com"
      # Attribute mode (real LDAP): omit group-search-base and set user-role-attribute instead
      # user-role-attribute: cudgroup
      role-mappings:
         ADMIN: "KAFKA_ADMIN"

    oidc:
      issuer-uri: "https://idp.example.com"
      client-id: "kafkatower"
      client-secret: "${OIDC_CLIENT_SECRET:}"
      admin-claim: "groups"
      admin-group-value: "kafka-admins"
      user-group-value: "kafka-users"

logging:
  level:
    com.lynra.kafkatower: INFO
