# Single-node setup without a database server: file-based H2 next to the jar.
# Activate with --spring.profiles.active=h2 (or SPRING_PROFILES_ACTIVE=h2).
spring:
  datasource:
    url: jdbc:h2:file:./kafkatower-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
