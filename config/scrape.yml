scrape_configs:

  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - order-service:8080

  - job_name: kafka
    metrics_path: /metrics
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: kminion
    metrics_path: /metrics
    static_configs:
      - targets:
          - kminion:8080