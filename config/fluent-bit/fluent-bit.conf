[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off

# Receives container logs from the `kafka` service's `fluentd` Docker logging
# driver (compose.yml sets fluentd-address: localhost:24224, tag: kafka.broker).
[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

# Ships them straight into OpenSearch's app-logs-kafka index (matches the
# app-logs-* pattern KafkaLogInspector queries by default — see application.yml
# agent.mcp.os.clusters.nonprod.index).
[OUTPUT]
    Name                es
    Match               kafka.broker
    Host                opensearch
    Port                9200
    Index               app-logs-kafka
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False
